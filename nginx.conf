server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # This is CRITICAL for React/Vite single page applications
        # It forces the server to return index.html for unknown routes instead of a 404
        try_files $uri $uri/ /index.html;
    }

    # Optional: Improve security and cache performance for static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
